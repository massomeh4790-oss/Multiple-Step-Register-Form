<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multi-step Register Form</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <div class="form-container">
      <form id="multi-step-form">
        <!-- step 1 -->
        <section class="form-step active">
          <h1>Register</h1>
          <p>Name</p>
          <input
            required
            id="name"
            class="input-page1"
            type="text"
            placeholder="Enter your name"
          />
          <p>Email</p>
          <input
            required
            id="email"
            class="input-page1"
            type="email"
            placeholder="Example@gmail.com"
          />
          <div class="btn">
            <button class="continue-btn" type="button">Continue</button>
          </div>
        </section>
        <!-- section 2 -->
        <section class="form-step">
          <h1 class="h1-page2">Which topic you are interested in?</h1>
          <label class="options first-option">
            <input type="checkbox" name="topics" value="dev" />
            <span>Software Development</span>
          </label>
          <label class="options">
            <input type="checkbox" name="topics" value="ux" />
            <span>User Experience</span>
          </label>
          <label class="options">
            <input type="checkbox" name="topics" value="design" />
            <span>Graphic Design</span>
          </label>
          <div class="btn">
            <button class="continue-btn" type="button">Continue</button>
          </div>
        </section>
        <!-- section 3 -->
        <section class="form-step">
          <h1>Summary</h1>
          <div class="user-info">
            <p class="summary-p">
              <span>Name: </span><strong id="summary-name"></strong>
            </p>
            <p class="summary-p">
              <span>Email: </span><strong id="summary-email"></strong>
            </p>
          </div>
          <div class="summary-topics">
            <p class="topic-p">Topics:</p>
            <ul class="topic-list"></ul>
          </div>
          <div class="btn">
            <button class="continue-btn" type="button">Continue</button>
          </div>
        </section>
      </form>
    </div>
    <div class="pages-container">
      <div class="step-wrapper">
        <span class="step-next">Step 1 of 3</span>
      </div>
      <div class="dots">
        <span class="dot active"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </div>
  </body>
</html>
